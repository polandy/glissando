name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The self-hosted image (ADR-0013), tested before it is pushed.
  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/polandy/glissando
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          docker build --file deploy/Dockerfile
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.version="$VERSION"
          --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" .
      - run: deploy/test-image.sh "$IMAGE:$VERSION"
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE:$VERSION" && docker push "$IMAGE:latest"
