version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Its browsers come from the digest-pinned image in ci.yml; both are bumped together by hand.
      - dependency-name: "@playwright/test"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      actions:
        patterns: ["*"]
